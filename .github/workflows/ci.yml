name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check Dockerfile base image
        run: ./check_dockerfile.sh

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-lab:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-lab:latest

      - name: Run container
        run: |
          docker run -d -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/ci-cd-lab:latest
          sleep 5

      - name: Smoke Test
        run: |
          curl http://localhost:5000 | grep "v2 - hello from CI"
  deploy-staging:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying application to staging..."

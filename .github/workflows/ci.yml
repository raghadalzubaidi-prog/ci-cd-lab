name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Check Dockerfile base image
        run: ./check_dockerfile.sh

      - name: Build Docker Image
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/ci-cd-lab:latest .

      - name: Push Docker Image
        run: |
          docker push ${{ secrets.DOCKER_USERNAME }}/ci-cd-lab:latest

      - name: Run container
        run: |
          docker run -d -p 5000:5000 ${{ secrets.DOCKER_USERNAME }}/ci-cd-lab:latest
          sleep 5

      - name: Smoke Test
        run: |
          curl http://localhost:5000 | grep "v2 - hello from CI"
  deploy-staging:
    needs: build-and-push
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Staging
        run: |
          echo "Deploying application to staging..."
  deploy-production:
    needs: deploy-staging
    runs-on: self-hosted

    environment:
      name: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Production
        run: |
          kubectl apply -f k8s/deployment-prod.yaml
          kubectl apply -f k8s/service.yaml
          kubectl rollout status deployment/ci-cd-app
  post-deploy-verification:
    needs: deploy-production
    runs-on: self-hosted

    steps:
      - uses: actions/checkout@v4

      - name: Check rollout status
        run: |
          kubectl rollout status deployment/ci-cd-app

      - name: Production smoke test
        run: |
          kubectl run curl-test \
            --image=curlimages/curl \
            --rm -i \
            --restart=Never \
            -- curl http://ci-cd-service | grep "v2 - hello from CI"

      - name: Rollback if verification fails
        if: failure()
        run: |
          kubectl rollout undo deployment/ci-cd-app
          exit 1
  notify-success:
    needs: post-deploy-verification
    runs-on: ubuntu-latest

    steps:
      - name: Production success notification
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"✅ Production deployment succeeded\nCommit: ${{ github.sha }}\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}

  notify-failure:
    if: failure()
    needs:
      - build-and-push
      - deploy-staging
      - deploy-production
      - post-deploy-verification
    runs-on: ubuntu-latest

    steps:
      - name: Pipeline failure notification
        run: |
          curl -H "Content-Type: application/json" \
          -d "{\"content\":\"❌ CI/CD Pipeline Failed\nCommit: ${{ github.sha }}\nStage failed: Check GitHub Actions\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}" \
          ${{ secrets.DISCORD_WEBHOOK }}
